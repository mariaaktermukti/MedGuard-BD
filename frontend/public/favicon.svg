<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="20" y1="18" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M32 4C44 11 53 12 55 22C56 36 46 51 32 60C18 51 8 36 9 22C11 12 20 11 32 4Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <path d="M32 7.5C42.5 13.8 50.2 14.7 52 23.2C52.8 35.1 44.2 47.9 32 55.7C19.8 47.9 11.2 35.1 12 23.2C13.8 14.7 21.5 13.8 32 7.5Z" 
        stroke="#6EE7B7" stroke-width="1.5" stroke-opacity="0.5" fill="none" />

  <!-- Medical Cross Base -->
  <rect x="27.5" y="18" width="9" height="26" rx="4" fill="url(#crossGrad)" />
  <rect x="19" y="26.5" width="26" height="9" rx="4" fill="url(#crossGrad)" />

  <!-- Safety Checkmark in Center -->
  <circle cx="32" cy="31" r="7.5" fill="#047857" />
  <path d="M28.5 31L31 33.5L35.5 28.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>